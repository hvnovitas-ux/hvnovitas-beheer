<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club100 Test</title>

<style>

/* =========================
   BASE
========================= */

body{
    margin:0;
    font-family:Georgia;
    background:#fff3e0;
}

/* =========================
   GRID
========================= */

#clubList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
    gap:14px;
    padding:14px;
}

/* =========================
   🟢 TEST: CLUB100 TEGELS GROEN
========================= */

#clubList > div{
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    background: green !important; /* 🔥 TEST */

    color:white;
    font-weight:bold;

    border-radius:12px;

    box-shadow:0 6px 14px rgba(0,0,0,0.2);
}

/* =========================
   OTHER CMS SECTIONS (SAFE)
========================= */

#highlightList,
#newsList,
#sponsorList,
#omejanList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
    padding:12px;
}

.card{
    background:white;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

.card img{
    width:100%;
    max-height:100px;
    object-fit:cover;
    border-radius:8px;
}

</style>

</head>

<body>

<!-- 🧱 CLUB100 -->
<div id="clubList"></div>

<!-- CMS SECTIONS -->
<div id="highlightList"></div>
<div id="newsList"></div>
<div id="sponsorList"></div>
<div id="omejanList"></div>

</body>
</html>
