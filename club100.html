<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* =========================
   🌑 ACHTERGROND
========================= */

body {
    margin: 0;
    background: #0b0b0b;
    font-family: Arial, sans-serif;
}

/* =========================
   🏺 HEADER
========================= */

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
}

/* =========================
   🧱 MUUR GRID
========================= */

.grid {
    display: grid;

    /* 🔥 perfecte “100 tegels muur” */
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

    gap: 12px;
    padding: 15px;

    max-width: 1200px;
    margin: auto;
}

/* =========================
   🏺 TEGEL (DELFTS STIJL)
========================= */

.tile {
    background: #fbfaf6;

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-family: Georgia, serif;
    color: #1e4f8a;

    box-shadow: 0 10px 22px rgba(0,0,0,0.6);
}

/* ❖ decoratie */
.tile::after {
    content: "❖";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    opacity: 0.25;
}

/* =========================
   🧠 TEKST
========================= */

.tile-name {
    text-align: center;
}

.tile-name div:first-child {
    font-size: 16px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 12px;
}

/* =========================
   📱 MOBIEL
========================= */

@media (max-width: 600px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>

</head>

<body>

<!-- 🏺 TITEL -->
<div class="header">
🏺 CLUB VAN 100 - HV NOVITAS
</div>

<!-- 🧱 TEGELS -->
<div class="grid" id="clubList"></div>

<!-- 🔥 FIREBASE SCRIPT -->
<script type="module" src="club100.js?v=3"></script>

</body>

</html>
