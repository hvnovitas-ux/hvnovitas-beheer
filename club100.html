<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* 🖤 ZWARTE MUUR */
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
}

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 22px;
}

/* 🧱 MUUR */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 DELFTS BLAUWE TEGEL */
.tile {
    background: #fdfcf7;

    border: 4px solid #1e4f8a;
    border-radius: 12px;

    padding: 28px;
    text-align: center;

    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;

    font-size: 20px;
    color: #1e4f8a;

    position: relative;

    box-shadow:
        0 6px 14px rgba(0,0,0,0.8),
        inset 0 0 0 2px rgba(30,79,138,0.15);
}

/* 🧩 keramiek rand */
.tile::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(30,79,138,0.15);
    border-radius: 8px;
    pointer-events: none;
}

/* ✨ hover */
.tile:hover {
    transform: scale(1.03);
    transition: 0.2s;
}

/* 📱 MOBILE */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="header">
CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubGrid"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
