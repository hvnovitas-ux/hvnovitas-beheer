<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* =========================
   🌑 ACHTERGROND MUUR
========================= */

body {
    margin: 0;
    background: 
        radial-gradient(circle at top, #111 0%, #070707 60%, #050505 100%);
    font-family: Arial;
    color: white;
}

/* =========================
   🏺 TITEL
========================= */

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 20px;
    font-weight: bold;
}

/* =========================
   🧱 MUUR GRID (BELANGRIJK)
========================= */

.grid {
    display: grid;

    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;

    padding: 20px;

    align-items: start;
}

/* =========================
   🏺 TEGEL (DOLFS MUUR STIJL)
========================= */

.tile {
    aspect-ratio: 1 / 1;

    background: #fbfaf6;

    border: 5px solid #1e4f8a;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-family: Georgia, serif;
    color: #1e4f8a;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.6),
        inset 0 0 0 1px rgba(30,79,138,0.15);

    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

/* hover */
.tile:hover {
    transform: scale(1.05);
    box-shadow: 0 12px 25px rgba(0,0,0,0.8);
}

/* decoratie */
.tile::after {
    content: "❖";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    opacity: 0.25;
}

/* =========================
   🧠 TEKST
========================= */

.tile-name {
    text-align: center;
    padding: 6px;
}

.tile-name div:first-child {
    font-size: 14px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 11px;
    opacity: 0.9;
}

/* =========================
   📱 MOBIEL
========================= */

@media (max-width: 600px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>

</head>

<body>

<div class="header">
🏺 CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
