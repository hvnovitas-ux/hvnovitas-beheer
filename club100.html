<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100</title>

<style>

/* 🌑 MUSEUM ACHTERGROND */
body {
    margin: 0;
    font-family: Georgia;

    background:
        radial-gradient(circle at top, #111 0%, #070707 60%, #050505 100%);
}

/* 🧱 MUUR GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 14px;
    padding: 18px;
    max-width: 1200px;
    margin: auto;
}

/* 🏺 TEGEL */
.tile {
    background: linear-gradient(145deg, #fbfaf6, #f0ece4);

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    color: #1e4f8a;

    box-shadow:
        0 10px 22px rgba(0,0,0,0.6),
        inset 0 0 10px rgba(255,255,255,0.3);

    opacity: 0;
    transform: scale(0.95);

    animation: fadeIn 0.4s ease forwards;
}

/* ✨ fade-in */
@keyframes fadeIn {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ❖ decoratie */
.tile::after {
    content: "❖";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    opacity: 0.25;
}

/* 🧠 tekst */
.tile-name {
    text-align: center;
}

.tile-name div:first-child {
    font-size: 16px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 12px;
}

/* 🥇 VIP TILE */
.tile.vip {
    background: linear-gradient(145deg, #ffe9a6, #d4af37);
    border: 6px solid #b8860b;
    color: #5a4300;

    box-shadow:
        0 12px 28px rgba(212,175,55,0.4),
        inset 0 0 12px rgba(255,255,255,0.3);
}

/* 📱 mobiel */
@media (max-width: 600px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

</style>

</head>

<body>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js?v=4"></script>

</body>

</html>
