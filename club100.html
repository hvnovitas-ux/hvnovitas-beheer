<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* =====================================================
   HV NOVITAS - CLUB VAN 100
   ===================================================== */

body {
    margin: 0;
    padding: 0;
    font-family: Georgia, serif;
    background: transparent;
}


/* =====================================================
   CLUB VAN 100 GRID
   ===================================================== */

#clubList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    padding: 18px;
}


/* =====================================================
   ZWARTE TEGEL MET ORANJE RAND
   ===================================================== */

.tile {
    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 30% 20%,
            #292929 0%,
            #111111 45%,
            #000000 100%
        );

    border: 7px solid #f58220;
    border-radius: 18px;

    box-shadow:
        inset 0 0 0 2px #000000,
        inset 0 0 22px rgba(245,130,32,0.30),
        0 10px 25px rgba(0,0,0,0.45);
}


/* =====================================================
   GLANS
   ===================================================== */

.tile::before {
    content: "";

    position: absolute;
    inset: -60%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.12),
            transparent 60%
        );

    transform: rotate(25deg);

    pointer-events: none;
}


/* =====================================================
   EXTRA ORANJE GLOED
   ===================================================== */

.tile::after {
    content: "";

    position: absolute;
    inset: 0;

    border-radius: 11px;

    box-shadow:
        inset 0 0 18px rgba(245,130,32,0.15);

    pointer-events: none;
}


/* =====================================================
   TEKST
   ===================================================== */

.tile-inner {
    position: relative;
    z-index: 2;

    display: flex;
    flex-direction: column;

    gap: 4px;

    color: #f58220;

    text-shadow:
        0 1px 2px #000,
        0 0 8px rgba(245,130,32,0.35);
}


/* =====================================================
   VOORNAAM
   ===================================================== */

.first {
    font-weight: bold;
    color: #f58220;
}


/* =====================================================
   ACHTERNAAM
   ===================================================== */

.last {
    opacity: 1;
    color: #f58220;
}


/* =====================================================
   TABLET / MOBIEL
   ===================================================== */

@media (max-width: 600px) {

    #clubList {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
        padding: 12px;
    }

    .tile {
        border-width: 5px;
        border-radius: 15px;
    }
}


/* =====================================================
   KLEINE TELEFOON
   ===================================================== */

@media (max-width: 400px) {

    #clubList {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 10px;
    }

    .tile {
        border-width: 5px;
    }
}

</style>

</head>


<body>

<div id="clubList"></div>

<script src="club100.js" type="module"></script>

</body>

</html>
