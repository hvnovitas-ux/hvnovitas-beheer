<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club100 VIP - HV Novitas</title>

<style>

/* 🌅 ACHTERGROND */
body{
    margin:0;
    font-family:Georgia;

    background:
        radial-gradient(circle at top, #fff3e0 0%, #f7e6cc 45%, #f2d9b8 100%);
}

/* 🧱 GRID */
#clubList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:18px;
    padding:18px;
}

/* 🟦 BASIS TEGEL */
.tile{
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 30% 20%, #ffffff 0%, #f7faff 50%, #e7eefc 100%);

    border:7px solid #1b4f9c;
    border-radius:18px;

    box-shadow:
        inset 0 0 0 2px #ffffff,
        inset 0 0 22px rgba(27,79,156,0.18),
        0 10px 25px rgba(0,0,0,0.18);

    transition:0.25s ease;

    font-family:Georgia;
    color:#1b3f7a;
}

/* ✨ glans */
.tile::before{
    content:"";
    position:absolute;
    inset:-60%;

    background:
        radial-gradient(circle, rgba(255,255,255,0.55), transparent 60%);

    transform:rotate(25deg);
    pointer-events:none;
}

/* 🧩 binnenrand detail */
.tile::after{
    content:"";
    position:absolute;
    inset:10px;

    border:1px solid rgba(27,79,156,0.25);
    border-radius:14px;

    pointer-events:none;
}

/* 🧱 tekst */
.tile-inner{
    position:relative;
    z-index:2;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.first{
    font-weight:bold;
    font-size:16px;
}

.last{
    font-size:14px;
    opacity:0.85;
}

/* 🥇 VIP BADGE */
.vip-badge{
    position:absolute;
    top:8px;
    right:8px;

    background:gold;
    color:#5a4300;

    font-size:10px;
    font-weight:bold;

    padding:3px 6px;
    border-radius:6px;

    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

/* 🚀 HOVER */
.tile:hover{
    transform:scale(1.06);
}

</style>

</head>

<body>

<!-- 🧱 CLUB100 -->
<div id="clubList"></div>

<script type="module">

import { db } from "./firebase.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

console.log("🏺 CLUB100 VIP LOADED");

onValue(ref(db, "club100"), (snapshot) => {

    const clubList = document.getElementById("clubList");

    const data = snapshot.val() || {};
    const items = Object.entries(data);

    if (!clubList) return;

    if (items.length === 0) {
        clubList.innerHTML = "<div>Geen leden</div>";
        return;
    }

    clubList.innerHTML = items.map(([id, p]) => {

        const fullName = (p.name || "").trim();
        const parts = fullName.split(" ");

        const firstName = parts[0] || "";
        const lastName = parts.slice(1).join(" ");

        const isVip = p.vip === true;

        return `
            <div class="tile">
                
                ${isVip ? `<div class="vip-badge">VIP</div>` : ""}

                <div class="tile-inner">
                    <div class="first">${firstName}</div>
                    <div class="last">${lastName}</div>
                </div>

            </div>
        `;
    }).join("");

});

</script>

</body>
</html>
