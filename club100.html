<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

body {
    margin: 0;
    background: #0b0b0b;
    font-family: Arial;
}

/* HEADER */
.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 TEGEL */
.tile {
    background: #fbfaf6;

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px;

    box-shadow:
        0 10px 22px rgba(0,0,0,0.65),
        inset 0 0 0 2px rgba(30,79,138,0.15);
}

/* ❖ ornament */
.tile::after {
    content: "❖";
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 12px;
    color: rgba(30,79,138,0.3);
}

/* 🧠 tekst */
.tile-name {
    width: 100%;
    text-align: center;

    display: flex;
    flex-direction: column;
    justify-content: center;

    gap: 4px;

    font-family: Georgia, serif;
    font-style: italic;
    color: #1e4f8a;
}

/* VOORNAAM */
.tile-name div:first-child {
    font-size: 18px;
    font-weight: bold;
    line-height: 1.1;
}

/* ACHTERNAAM */
.tile-name div:last-child {
    font-size: 14px;
    opacity: 0.9;
    line-height: 1.1;
}

/* MOBILE */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="header">
🏺 CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
