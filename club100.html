<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club van 100 - HV Novitas</title>

<style>

/* =========================
   SAFE BASE (NIET KAPOT MAKEN)
========================= */

body{
    margin:0;
    font-family:Georgia;

    /* ✅ OUD-HOLLANDS (VEILIG + ZICHTBAAR) */
    background:#fff3e0;

    color:#1b3f7a;
}

/* =========================
   GRID (NIET VERANDEREN)
========================= */

#clubList,
#highlightList,
#newsList,
#sponsorList,
#omejanList{
    display:grid !important;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:12px;
    padding:12px;
}

/* =========================
   🇳🇱 OUD-HOLLANDSE TEGELS (VEILIG)
========================= */

.tile{
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background: radial-gradient(circle at top left, #ffffff, #eef3ff);

    border:5px solid #1b4f9c;
    border-radius:12px;

    color:#1b3f7a;
    font-weight:bold;

    box-shadow:
        inset 0 0 0 2px #ffffff,
        0 4px 12px rgba(0,0,0,0.12);

    position:relative;
    overflow:hidden;
}

/* veilige glans */
.tile::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle, rgba(255,255,255,0.35), transparent 60%);
    pointer-events:none;
}

/* tekst boven alles */
.tile > *{
    position:relative;
    z-index:2;
}

/* =========================
   CARDS
========================= */

.card{
    background:white;
    padding:10px;
    border-radius:12px;
    border:2px solid #1b3f7a;
}

/* images veilig */
.card img{
    width:100%;
    max-height:100px;
    object-fit:cover;
    border-radius:8px;
}

/* hover safe */
.tile:hover,
.card:hover{
    transform:scale(1.02);
    transition:0.2s ease;
}

</style>

</head>

<body>

<!-- 🧱 CLUB100 -->
<div id="clubList"></div>

<!-- CMS SECTIES -->
<div id="highlightList"></div>
<div id="newsList"></div>
<div id="sponsorList"></div>
<div id="omejanList"></div>

<script type="module" src="club100.js"></script>

</body>
</html>
