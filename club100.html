<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
}

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 22px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* TEGEL */
.tile {
    background: #fdfcf7;
    border: 6px solid #1e4f8a;
    border-radius: 14px;

    padding: 25px;
    text-align: center;

    font-family: Georgia, serif;
    font-style: italic;
    font-size: 20px;
    color: #1e4f8a;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.7),
        inset 0 0 0 2px rgba(30,79,138,0.15);
}

/* MOBILE */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="header">
CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
