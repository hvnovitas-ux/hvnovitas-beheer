<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club100 - HV Novitas</title>

<style>

/* 🌅 achtergrond */
body{
    margin:0;
    font-family:Georgia;

    background:
        radial-gradient(circle at top, #fff3e0 0%, #f7e6cc 45%, #f2d9b8 100%);
}

/* 🧱 grid */
#clubList{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:18px;
    padding:18px;
}

/* 🟦 tegel */
.tile{
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 30% 20%, #ffffff 0%, #f7faff 50%, #e7eefc 100%);

    border:7px solid #1b4f9c;
    border-radius:18px;

    box-shadow:
        inset 0 0 0 2px #ffffff,
        inset 0 0 22px rgba(27,79,156,0.18),
        0 10px 25px rgba(0,0,0,0.18);
}

/* glans */
.tile::before{
    content:"";
    position:absolute;
    inset:-60%;
    background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 60%);
    transform:rotate(25deg);
}

/* tekst */
.tile-inner{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.first{
    font-weight:bold;
}

.last{
    opacity:0.85;
}

</style>

</head>

<body>

<div id="clubList"></div>

<script src="club100.js" type="module"></script>

</body>
</html>
