<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100</title>

<style>

body {
    margin: 0;
    background: #0b0b0b;
    font-family: Arial;
}

/* 🧱 MUUR GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
    padding: 15px;
}

/* 🏺 TEGEL */
.tile {
    background: #fbfaf6;
    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-family: Georgia, serif;
    color: #1e4f8a;

    box-shadow: 0 10px 22px rgba(0,0,0,0.6);
}

/* ❖ decoratie */
.tile::after {
    content: "❖";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    opacity: 0.25;
}

/* 🧠 tekst */
.tile-name {
    text-align: center;
}

.tile-name div:first-child {
    font-size: 16px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 12px;
}

</style>

</head>

<body>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
