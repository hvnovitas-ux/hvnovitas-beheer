<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100</title>

<style>

body {
    margin: 0;
    background: #0b0b0b;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 TEGEL */
.tile {
    background: #fbfaf6;
    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    font-family: Georgia, serif;
    color: #1e4f8a;

    box-shadow: 0 10px 22px rgba(0,0,0,0.6);
}

/* ornament */
.tile::after {
    content: "❖";
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 12px;
    color: rgba(30,79,138,0.3);
}

/* tekst */
.tile-name {
    text-align: center;
}

.tile-name div:first-child {
    font-size: 18px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 14px;
}

</style>

</head>

<body>

<div class="grid" id="clubList"></div>

<!-- Firebase v8 (BELANGRIJK: werkt overal) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="club100.js"></script>

</body>

</html>
