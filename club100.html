<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* 🌑 achtergrond */
body {
    margin: 0;
    background: #0b0b0b;
    font-family: Arial;
}

/* 🧱 GRID (BELANGRIJK FIX: niet te groot meer) */
.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    gap: 15px;
    padding: 20px;

    justify-content: center;
}

/* 🏺 TEGEL */
.tile {
    background: #fbfaf6;

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;
    max-width: 200px;
    width: 100%;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    box-shadow: 0 10px 22px rgba(0,0,0,0.6);

    font-family: Georgia, serif;
    color: #1e4f8a;
}

/* ❖ ornament */
.tile::after {
    content: "❖";
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 12px;
    color: rgba(30,79,138,0.3);
}

/* 🧠 tekst */
.tile-name {
    text-align: center;
    width: 100%;
}

.tile-name div:first-child {
    font-size: 20px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 15px;
    opacity: 0.9;
}

/* 📱 mobiel */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="grid" id="clubList"></div>

<!-- Firebase v12 (JOUW SYSTEEM) -->
<script type="module" src="club100.js"></script>

</body>

</html>
