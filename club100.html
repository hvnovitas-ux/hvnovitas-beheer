<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* 🖤 achtergrond */
body {
    margin: 0;
    background: #0b0b0b;
    font-family: Arial;
}

/* header */
.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 20px;
}

/* grid muur */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 DELFTS TEGEL */
.tile {
    background: #fdfcf7;

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    text-align: center;

    font-family: Georgia, serif;
    font-style: italic;

    color: #1e4f8a;

    box-shadow:
        0 12px 25px rgba(0,0,0,0.7),
        inset 0 0 0 2px rgba(30,79,138,0.15),
        inset 0 0 30px rgba(255,255,255,0.6);
}

/* 🧿 binnenrand */
.tile::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(30,79,138,0.25);
    border-radius: 10px;
    pointer-events: none;
}

/* ❖ hoek ornament */
.tile::after {
    content: "❖";
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 14px;
    color: rgba(30,79,138,0.35);
}

/* naam blok */
.tile-name div:first-child {
    font-size: 20px;
    font-weight: bold;
}

.tile-name div:last-child {
    font-size: 16px;
}

/* mobiel */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="header">
CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubList"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
