<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

/* 🖤 MUSEUM MUUR */
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
}

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 22px;
}

/* 🧱 MUUR */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 DELFTS SPREUKTEGEL (ORNAMENT STYLE) */
.tile {
    background: #fdfcf7;

    border: 6px solid #1e4f8a;
    border-radius: 14px;

    padding: 30px;
    text-align: center;

    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 20px;
    color: #1e4f8a;

    position: relative;

    box-shadow:
        0 10px 22px rgba(0,0,0,0.7),
        inset 0 0 0 2px rgba(30,79,138,0.15),
        inset 0 0 25px rgba(255,255,255,0.6);

    transition: 0.2s ease;
}

/* 🧿 BINNENKADER */
.tile::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px solid rgba(30,79,138,0.25);
    border-radius: 10px;
    pointer-events: none;
}

/* ❖ ORNAMENT HOEK */
.tile::after {
    content: "❖";
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 14px;
    color: rgba(30,79,138,0.35);
}

/* ✨ hover */
.tile:hover {
    transform: scale(1.04);
}

/* 📱 MOBILE */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="header">
CLUB VAN 100 - HV NOVITAS
</div>

<div class="grid" id="clubGrid"></div>

<script type="module" src="club100.js"></script>

</body>

</html>
