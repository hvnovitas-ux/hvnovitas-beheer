<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlights - HV Novitas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
.wrap{max-width:1000px;margin:0 auto;padding:20px}.title{text-align:center;margin:0 0 22px;font-size:28px}
.list{display:grid;gap:14px}.item{background:#fff;border-left:5px solid #ff6a00;border-radius:12px;padding:18px 20px;box-shadow:0 4px 16px rgba(0,0,0,.07);border-top:1px solid #eee;border-right:1px solid #eee;border-bottom:1px solid #eee}
.date{font-size:13px;color:#777;margin-bottom:6px}.item h2{margin:0 0 8px;font-size:20px}.item p{margin:0;line-height:1.5}.empty{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<div class="wrap"><h1 class="title">🏆 Highlights</h1><div id="highlightList" class="list"></div></div>
<script type="module">
import { db } from "./firebase.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const prettyDate=d=>{if(!d)return"";const x=new Date(d+"T00:00:00");return isNaN(x)?d:x.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});};
onValue(ref(db,"highlights"),snap=>{
 const data=Object.values(snap.val()||{});
 data.sort((a,b)=>(new Date(b.date||0).getTime()||b.created||0)-(new Date(a.date||0).getTime()||a.created||0));
 document.getElementById("highlightList").innerHTML=data.length?data.map(v=>`<article class="item">${v.date?`<div class="date">${esc(prettyDate(v.date))}</div>`:""}<h2>${esc(v.title||"")}</h2><p>${esc(v.text||"")}</p></article>`).join(""):"<div class=\"empty\">Geen highlights beschikbaar.</div>";
});
</script>
</body>
</html>
