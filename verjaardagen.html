<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verjaardagen - HV Novitas</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *{box-sizing:border-box}
    :root{--orange:#ff6a00;--ink:#202124;--muted:#68717d;--line:#e5e7eb;--page:#f5f6f8}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--page);color:var(--ink)}
    .topbar{min-height:70px;background:var(--orange);color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center;gap:18px}
    .brand{font-size:19px;font-weight:800;letter-spacing:.04em}
    .userbox{display:flex;align-items:center;gap:14px}
    button,.button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-block}
    .light{background:#fff;color:#b94700}.primary{background:var(--orange);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}
    main{width:min(1000px,calc(100% - 32px));margin:26px auto}
    .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #14192308}
    .heading{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    h1{margin:8px 0;font-size:clamp(25px,3vw,32px)}h2{margin:0 0 8px}
    p{line-height:1.5}.muted{color:var(--muted)}.eyebrow{color:var(--orange);font-weight:800;font-size:12px;letter-spacing:.08em;margin:0}
    #birthdayList{display:grid;gap:10px;margin-top:18px}
    .birthday{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:15px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:15px}
    .datebox{background:#fff2e8;border-radius:9px;text-align:center;padding:10px 6px;color:#a74400;font-weight:800}
    .datebox strong{display:block;font-size:23px;line-height:1.2}.datebox span{font-size:12px;text-transform:uppercase}
    .name{font-weight:800;font-size:16px}.details{color:var(--muted);font-size:14px;margin-top:4px}
    .days{font-weight:800;white-space:nowrap;color:#a74400}
    .empty{padding:24px;text-align:center;background:#fafafa;border-radius:10px;color:var(--muted)}
    #status{margin-top:14px;color:var(--muted)}
    @media(max-width:600px){.topbar{padding:14px 16px;align-items:flex-start;flex-direction:column}.userbox{width:100%;justify-content:space-between}.panel{padding:17px}.birthday{grid-template-columns:62px minmax(0,1fr);gap:11px;padding:11px}.datebox strong{font-size:20px}.days{grid-column:2;white-space:normal;font-size:13px}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">🧡 HV NOVITAS CMS</div>
  <div class="userbox"><span id="userInfo">Laden...</span><button id="logoutButton" class="light" type="button">Uitloggen</button></div>
</header>
<main>
  <section class="panel">
    <div class="heading">
      <div><p class="eyebrow">CMS · LEDEN</p><h1>Verjaardagen</h1><p class="muted">Huidige leden die vandaag of binnen de komende 20 dagen jarig zijn, op volgorde van verjaardag.</p></div>
      <a class="button secondary" href="dashboard.html">← Dashboard</a>
    </div>
    <button id="refreshButton" class="primary" type="button">Verjaardagen opnieuw laden</button>
    <div id="status" role="status" aria-live="polite">Leden laden...</div>
    <div id="birthdayList"></div>
  </section>
</main>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const el = id => document.getElementById(id);
let authorized = false;
onAuthStateChanged(auth, user => {
  if (!user) { location.href = "login.html"; return; }
  authorized = true;
  el("userInfo").textContent = user.displayName || user.email || "Beheerder";
  loadBirthdays();
});
el("logoutButton").addEventListener("click", async () => {
  try { await signOut(auth); location.href = "login.html"; }
  catch (error) { console.error(error); alert("Uitloggen is niet gelukt."); }
});
el("refreshButton").addEventListener("click", loadBirthdays);

function validISODate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ""))) return false;
  const d = new Date(value + "T00:00:00Z");
  return !Number.isNaN(d.getTime()) && d.toISOString().slice(0,10) === value;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function dateAtDayOffset(today, offset) {
  const date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + offset);
  return { month: date.getMonth() + 1, day: date.getDate(), date };
}
function birthdayOffset(birthDate, today) {
  if (!validISODate(birthDate)) return null;
  const [, month, day] = birthDate.split("-").map(Number);
  for (let offset = 0; offset <= 20; offset++) {
    const target = dateAtDayOffset(today, offset);
    if (target.month === month && target.day === day) return { offset, date: target.date };
  }
  return null;
}
function formatDate(date) {
  return date.toLocaleDateString("nl-NL", { day:"numeric", month:"long" });
}
async function loadBirthdays() {
  if (!authorized) return;
  const button = el("refreshButton");
  button.disabled = true;
  el("status").textContent = "Leden ophalen...";
  el("birthdayList").innerHTML = "";
  try {
    const snapshot = await get(ref(db, "ledenadministratie/leden"));
    const records = snapshot.val() || {};
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const birthdays = Object.values(records)
      .filter(member => member && member.naam && member.active !== false && validISODate(member.lidSinds) && member.lidSinds >= "2012-01-01")
      .map(member => {
        const result = birthdayOffset(member.geboorteDatum, today);
        if (!result) return null;
        const birthYear = Number(member.geboorteDatum.slice(0,4));
        const age = result.date.getFullYear() - birthYear;
        return { name: member.naam, category: member.categorie || "", birthDate: member.geboorteDatum, age, ...result };
      })
      .filter(Boolean)
      .sort((a,b) => a.offset - b.offset || a.name.localeCompare(b.name, "nl"));
    el("status").textContent = birthdays.length
      ? `${birthdays.length} ${birthdays.length === 1 ? "lid is" : "leden zijn"} vandaag of binnen 20 dagen jarig.`
      : "Geen huidige leden met een geregistreerde verjaardag in de komende 20 dagen.";
    el("birthdayList").innerHTML = birthdays.map(item => {
      const dayText = item.offset === 0 ? "Vandaag jarig" : item.offset === 1 ? "Morgen jarig" : `Over ${item.offset} dagen`;
      const dateLabel = formatDate(item.date);
      const ageLabel = `wordt ${item.age} jaar`;
      return `<article class="birthday">
        <div class="datebox"><strong>${item.date.getDate()}</strong><span>${item.date.toLocaleDateString("nl-NL",{month:"short"})}</span></div>
        <div><div class="name">${escapeHtml(item.name)}</div><div class="details">${escapeHtml(dateLabel)} · ${escapeHtml(ageLabel)}${item.category ? " · " + escapeHtml(item.category) : ""}</div></div>
        <div class="days">${escapeHtml(dayText)}</div>
      </article>`;
    }).join("");
  } catch (error) {
    console.error("Verjaardagen laden mislukt:", error);
    el("status").textContent = "De verjaardagen konden niet worden geladen. Controleer de Firebase-toegangsregels.";
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
