<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HV Novitas | Inschrijvingen</title>

    <link
        rel="stylesheet"
        href="cms.css">

    <link
        rel="stylesheet"
        href="inschrijvingen.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- PAGINA HEADER                             -->
    <!-- ========================================= -->

    <header class="page-header">

        <h1>📋 Inschrijvingen</h1>

        <p>
            Beheer alle online inschrijvingen van HV Novitas.
        </p>

    </header>

    <!-- ========================================= -->
    <!-- ZOEKEN                                    -->
    <!-- ========================================= -->

    <section class="search-section">

        <input

            type="text"

            id="searchInput"

            placeholder="🔍 Zoek op naam..."

            autocomplete="off">

    </section>
     <!-- ========================================= -->
    <!-- INSCHRIJVINGEN                            -->
    <!-- ========================================= -->

    <main class="content">

        <section

            id="inschrijvingenContainer"

            class="inschrijvingen-container">

            <!--

                Hier worden automatisch
                alle inschrijvingen geplaatst
                door inschrijvingen.js

            -->

        </section>

    </main>

    <!-- ========================================= -->
    <!-- DETAILS                                   -->
    <!-- ========================================= -->

    <div

        id="detailModal"

        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>

                    Inschrijving

                </h2>

                <button

                    id="closeModal"

                    class="close-button">

                    ✖

                </button>

            </div>

            <div

                id="detailContent"

                class="modal-body">

            </div>

        </div>

    </div>
     <!-- ========================================= -->
    <!-- JAVASCRIPT                                -->
    <!-- ========================================= -->

    <script

        type="module"

        src="inschrijvingen.js">

    </script>

</body>

</html>
