<!DOCTYPE html>
<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>HV Novitas | Inschrijvingen</title>

    <link
        rel="stylesheet"
        href="cms.css">

    <link
        rel="stylesheet"
        href="inschrijvingen.css">

</head>

<body>

    <!-- ========================================= -->
    <!-- HEADER                                    -->
    <!-- ========================================= -->

    <header class="page-header">

        <h1>

            📋 Inschrijvingen

        </h1>

        <p>

            Overzicht van alle online inschrijvingen.

        </p>

    </header>

    <!-- ========================================= -->
    <!-- ZOEKBALK                                  -->
    <!-- ========================================= -->

    <section class="search-section">

        <input

            id="searchInput"

            type="text"

            placeholder="🔍 Zoek op naam..."

            autocomplete="off">

    </section>
     <!-- ========================================= -->
    <!-- INSCHRIJVINGEN                            -->
    <!-- ========================================= -->

    <main class="content">

        <section
            id="inschrijvingenContainer"
            class="inschrijvingen-container">

        </section>

    </main>

    <!-- ========================================= -->
    <!-- POPUP                                     -->
    <!-- ========================================= -->

    <div
        id="detailModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>

                    Inschrijfformulier

                </h2>

                <button
                    id="closeModal"
                    class="close-button">

                    ✖

                </button>

            </div>

            <div
                id="detailContent"
                class="modal-body">

                <!-- Wordt gevuld door JavaScript -->

            </div>

            <div class="detail-buttons">

                <button
                    id="printButton"
                    class="openButton">

                    🖨 Afdrukken / Opslaan als PDF

                </button>

                <button
                    id="deleteButton"
                    class="deleteButton">

                    🗑 Verwijderen

                </button>

            </div>

        </div>

    </div>
     <!-- ========================================= -->
    <!-- JAVASCRIPT                                -->
    <!-- ========================================= -->

    <script
        type="module"
        src="inschrijvingen.js">

    </script>

</body>

</html>
