<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HV Novitas Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f8;
}

.topbar {
    background: #ff6a00;
    color: white;
    padding: 15px;
    font-weight: bold;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

.menu a {
    display: block;
    background: white;
    color: black;
    text-decoration: none;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    border-left: 4px solid #ff6a00;
}

.menu a:hover {
    background: #eee;
}

button {
    padding:6px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="topbar">
    <div>🧡 HV NOVITAS DASHBOARD</div>

    <!-- 🔐 USER INFO -->
    <div id="userInfo">Laden...</div>

    <button onclick="logout()">Uitloggen</button>
</div>

<div class="menu">

    <a href="cms.html">📰 Nieuws beheren</a>

    <a href="proeftrainingen.html">🏃 Proeftrainingen</a>

    <a href="sponsors.html">🤝 Sponsors</a>

    <a href="instellingen.html">⚙️ Instellingen</a>

</div>

<!-- 🔐 AUTH SCRIPT -->
<script type="module">

import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userInfo").innerText =
        "👋 " + (user.displayName || "Admin");

});

window.logout = async function () {
    await signOut(auth);
    window.location.href = "login.html";
};

</script>

</body>
</html>
