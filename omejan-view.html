<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ome Jan - HV Novitas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#222}
.wrap{max-width:1100px;margin:0 auto;padding:0}
h1{margin:0 0 20px;text-align:center;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1px solid #eee}
.card img{display:block;width:100%;height:260px;object-fit:cover}
.empty{text-align:center;color:#777;padding:30px}
</style>
</head>
<body>
<div class="wrap">
<div id="omejanGrid" class="grid"></div>
</div>
<script type="module">
import { db } from "./firebase.js";
import { ref, onValue } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
onValue(ref(db,"omejan"),snap=>{
 const data=Object.values(snap.val()||{}).filter(v=>v?.imageUrl);
 data.sort((a,b)=>(b.created||0)-(a.created||0));
 document.getElementById("omejanGrid").innerHTML=data.length?data.map(v=>`<div class="card"><img src="${esc(v.imageUrl)}" alt="Ome Jan"></div>`).join(""):"<div class=\"empty\">Geen afbeeldingen beschikbaar.</div>";
});
</script>
</body>
</html>
