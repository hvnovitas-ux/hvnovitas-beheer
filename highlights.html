<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlights - HV Novitas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#222}
.topbar{background:#ff6a00;color:#fff;padding:15px 20px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.title{font-size:20px}
.page{max-width:1000px;margin:30px auto;padding:0 20px}
.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.07);margin-bottom:18px}
.grid{display:grid;gap:14px}
.item{background:#fafafa;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
.item img{width:220px;max-width:100%;height:140px;object-fit:cover;display:block;border-radius:10px;margin-bottom:12px;background:#eee}
.row{display:flex;gap:10px;flex-wrap:wrap}
.input,input[type=text],input[type=date],input[type=file],textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
textarea{min-height:110px;resize:vertical}
.btn,button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold;background:#ff6a00;color:#fff}
.btn-secondary{background:#64748b}
.btn-edit{background:#2563eb}
.btn-danger{background:#dc2626}
.help{color:#6b7280;font-size:14px}
.two{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.form-title{margin-top:0}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.preview{margin-top:12px}
.preview img{width:220px;max-width:100%;height:140px;object-fit:cover;border-radius:10px;display:block;border:1px solid #e5e7eb}
.item-title{font-size:20px;font-weight:800;margin:0 0 6px}
.item-date{color:#ff6a00;font-size:13px;font-weight:800;margin-bottom:10px}
.item-text{color:#4b5563;line-height:1.5;margin:0 0 14px;white-space:pre-wrap}
.item-actions{display:flex;gap:8px;flex-wrap:wrap}
.status{margin-top:10px;font-size:14px;color:#475569}
.empty{color:#6b7280}
.back{display:inline-block;margin-top:8px;text-decoration:none;color:#2563eb}
@media(max-width:700px){.two{grid-template-columns:1fr}.item img{height:auto;max-height:220px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">🧡 HV NOVITAS CMS</div>
  <div>
    <span id="userInfo">Laden...</span>
    <button id="logoutButton" type="button">Uitloggen</button>
  </div>
</div>

<main class="page">

  <div class="card">
    <h1 class="form-title">🏆 <span id="formHeading">Highlight toevoegen</span></h1>

    <div class="two">
      <div>
        <label for="hlDate"><strong>Datum</strong></label>
        <input id="hlDate" type="date">
      </div>
      <div>
        <label for="hlTitle"><strong>Titel</strong></label>
        <input id="hlTitle" type="text" placeholder="Titel van de highlight">
      </div>
    </div>

    <br>

    <label for="hlText"><strong>Tekst</strong></label>
    <textarea id="hlText" placeholder="Beschrijving van de highlight"></textarea>

    <br><br>

    <label for="hlImage"><strong>Foto</strong></label>
    <input id="hlImage" type="file" accept="image/*">
    <div class="help" id="imageHelp">Een foto is niet verplicht.</div>
    <div class="preview" id="imagePreview"></div>

    <div class="form-actions">
      <button id="saveHighlight" type="button">➕ Toevoegen</button>
      <button id="cancelEdit" type="button" class="btn-secondary" style="display:none;">Annuleren</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <div class="card">
    <h2>Opgeslagen highlights</h2>
    <div id="highlightList" class="grid"></div>
  </div>

  <a class="back" href="dashboard.html">← Terug naar dashboard</a>

</main>

<script type="module">
import { auth, db } from "./firebase.js";
import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  ref,
  push,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

// ================= ELEMENTEN =================

const userInfo = document.getElementById("userInfo");
const logoutButton = document.getElementById("logoutButton");
const hlDate = document.getElementById("hlDate");
const hlTitle = document.getElementById("hlTitle");
const hlText = document.getElementById("hlText");
const hlImage = document.getElementById("hlImage");
const saveButton = document.getElementById("saveHighlight");
const cancelButton = document.getElementById("cancelEdit");
const formHeading = document.getElementById("formHeading");
const highlightList = document.getElementById("highlightList");
const imagePreview = document.getElementById("imagePreview");
const imageHelp = document.getElementById("imageHelp");
const status = document.getElementById("status");

let editingId = null;
let editingImageUrl = "";
let highlightData = {};

// ================= AUTH =================

onAuthStateChanged(auth, (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  userInfo.textContent = "👋 " + (user.displayName || user.email || "Admin");
});

logoutButton.addEventListener("click", async () => {
  try {
    await signOut(auth);
    location.href = "login.html";
  } catch (error) {
    console.error(error);
    alert("Uitloggen is niet gelukt.");
  }
});

// ================= CLOUDINARY =================

async function uploadToCloudinary(file) {
  if (!file) return "";

  if (!file.type.startsWith("image/")) {
    throw new Error("Kies een afbeeldingsbestand.");
  }

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", "hvnovitas_upload");

  const response = await fetch(
    "https://api.cloudinary.com/v1_1/hwxe3jzg/image/upload",
    {
      method: "POST",
      body: form
    }
  );

  if (!response.ok) {
    throw new Error("Cloudinary upload mislukt.");
  }

  const data = await response.json();
  return data.secure_url || "";
}

// ================= FOTO VOORVERTONING =================

hlImage.addEventListener("change", () => {
  const file = hlImage.files[0];
  imagePreview.innerHTML = "";

  if (!file) {
    if (editingImageUrl) showPreview(editingImageUrl);
    return;
  }

  const url = URL.createObjectURL(file);
  showPreview(url, true);
});

function showPreview(url, temporary = false) {
  imagePreview.innerHTML = `<img src="${esc(url)}" alt="Voorvertoning highlight">`;

  if (temporary) {
    const img = imagePreview.querySelector("img");
    if (img) {
      img.addEventListener("load", () => URL.revokeObjectURL(url), { once: true });
    }
  }
}

// ================= OPSLAAN =================

saveButton.addEventListener("click", async () => {
  const date = hlDate.value.trim();
  const title = hlTitle.value.trim();
  const text = hlText.value.trim();
  const file = hlImage.files[0];

  if (!date) {
    alert("Vul een datum in.");
    return;
  }

  if (!title) {
    alert("Vul een titel in.");
    return;
  }

  if (!text) {
    alert("Vul een tekst in.");
    return;
  }

  try {
    setBusy(true);

    let imageUrl = editingImageUrl;

    if (file) {
      status.textContent = "📸 Foto wordt geüpload...";
      imageUrl = await uploadToCloudinary(file);
    }

    const payload = {
      date,
      title,
      text,
      imageUrl,
      created: editingId ? (highlightData[editingId]?.created || Date.now()) : Date.now(),
      updated: Date.now()
    };

    if (editingId) {
      await update(ref(db, "highlights/" + editingId), payload);
      status.textContent = "✅ Highlight bijgewerkt.";
    } else {
      await push(ref(db, "highlights"), payload);
      status.textContent = "✅ Highlight toegevoegd.";
    }

    resetForm();
  } catch (error) {
    console.error(error);
    alert(error.message || "Highlight kon niet worden opgeslagen.");
    status.textContent = "❌ Opslaan mislukt.";
  } finally {
    setBusy(false);
  }
});

// ================= ANNULEREN =================

cancelButton.addEventListener("click", () => {
  resetForm();
  status.textContent = "";
});

function resetForm() {
  editingId = null;
  editingImageUrl = "";
  hlDate.value = "";
  hlTitle.value = "";
  hlText.value = "";
  hlImage.value = "";
  imagePreview.innerHTML = "";
  imageHelp.textContent = "Een foto is niet verplicht.";
  formHeading.textContent = "Highlight toevoegen";
  saveButton.textContent = "➕ Toevoegen";
  cancelButton.style.display = "none";
}

// ================= FIREBASE LIJST =================

onValue(ref(db, "highlights"), (snapshot) => {
  highlightData = snapshot.val() || {};
  renderHighlights();
});

function renderHighlights() {
  const entries = Object.entries(highlightData)
    .sort((a, b) => {
      const ca = Number(a[1]?.created || 0);
      const cb = Number(b[1]?.created || 0);
      return cb - ca;
    });

  if (entries.length === 0) {
    highlightList.innerHTML = '<p class="empty">Geen highlights.</p>';
    return;
  }

  highlightList.innerHTML = entries.map(([id, value]) => `
    <div class="item">
      ${value.imageUrl ? `<img src="${esc(value.imageUrl)}" alt="Highlight">` : ""}
      <div class="item-title">${esc(value.title || "")}</div>
      <div class="item-date">📅 ${esc(value.date || "")}</div>
      <p class="item-text">${esc(value.text || "")}</p>
      <div class="item-actions">
        <button type="button" class="btn-edit" data-edit="${esc(id)}">✏️ Bewerken</button>
        <button type="button" class="btn-danger" data-delete="${esc(id)}">🗑️ Verwijderen</button>
      </div>
    </div>
  `).join("");

  document.querySelectorAll("#highlightList [data-edit]").forEach(button => {
    button.addEventListener("click", () => startEdit(button.dataset.edit));
  });

  document.querySelectorAll("#highlightList [data-delete]").forEach(button => {
    button.addEventListener("click", () => deleteHighlight(button.dataset.delete));
  });
}

// ================= BEWERKEN =================

function startEdit(id) {
  const item = highlightData[id];
  if (!item) return;

  editingId = id;
  editingImageUrl = item.imageUrl || "";

  hlDate.value = item.date || "";
  hlTitle.value = item.title || "";
  hlText.value = item.text || "";
  hlImage.value = "";

  formHeading.textContent = "Highlight bewerken";
  saveButton.textContent = "💾 Wijzigingen opslaan";
  cancelButton.style.display = "inline-block";

  imageHelp.textContent = editingImageUrl
    ? "Kies alleen een nieuw bestand wanneer je de huidige foto wilt vervangen."
    : "Deze highlight heeft nog geen foto. Kies een bestand om een foto toe te voegen.";

  imagePreview.innerHTML = editingImageUrl
    ? `<img src="${esc(editingImageUrl)}" alt="Huidige highlightfoto">`
    : "";

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ================= VERWIJDEREN =================

async function deleteHighlight(id) {
  const item = highlightData[id];
  if (!item) return;

  const title = item.title || "deze highlight";

  if (!confirm(`Weet je zeker dat je "${title}" wilt verwijderen?`)) {
    return;
  }

  try {
    await remove(ref(db, "highlights/" + id));

    if (editingId === id) {
      resetForm();
    }

    status.textContent = "✅ Highlight verwijderd.";
  } catch (error) {
    console.error(error);
    alert("Highlight kon niet worden verwijderd.");
  }
}

// ================= KNOP STATUS =================

function setBusy(busy) {
  saveButton.disabled = busy;
  cancelButton.disabled = busy;
  saveButton.style.opacity = busy ? ".6" : "1";
  saveButton.style.cursor = busy ? "wait" : "pointer";
}

// ================= ESCAPE HTML =================

function esc(value = "") {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
