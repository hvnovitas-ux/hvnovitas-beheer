<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club van 100 - HV Novitas</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #f4f6f8;
}

.header {
    background: #0b2a4a;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 22px;
}

/* 🏺 MUUR */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* 🏺 DELFTS BLAUWE TEGEL */
.tile {
    background: linear-gradient(135deg, #1f4b8f, #2e63b8);
    color: white;

    border: 3px solid #0b2a4a;
    border-radius: 14px;

    padding: 25px;
    text-align: center;

    font-family: "Segoe Script", "Brush Script MT", cursive;

    font-size: 20px;

    box-shadow:
        0 8px 15px rgba(0,0,0,0.25),
        inset 0 0 15px rgba(255,255,255,0.15);

    transition: 0.2s ease;
}

.tile:hover {
    transform: scale(1.05);
}

/* 📱 MOBILE */
@media (max-width: 700px) {
    .grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>
