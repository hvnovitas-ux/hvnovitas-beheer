<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HV Novitas CMS</title>

<link rel="stylesheet" href="cms.css">
</head>

<body>

<!-- ➕ INPUTS -->
<div class="section">
    <h2>➕ Club100</h2>
    <input id="clubName" placeholder="Naam">
    <button id="saveClub100">Toevoegen</button>
</div>

<div class="section">
    <h2>➕ Highlight</h2>
    <input id="hlTitle" placeholder="Titel">
    <input id="hlText" placeholder="Tekst">
    <button id="saveHighlight">Toevoegen</button>
</div>

<div class="section">
    <h2>➕ Nieuws</h2>
    <input id="newsTitle" placeholder="Titel">
    <input id="newsText" placeholder="Tekst">
    <button id="saveNews">Toevoegen</button>
</div>

<!-- 📦 OUTPUT -->
<div class="section">
    <h2>🧱 Club van 100</h2>
    <div id="clubList"></div>
</div>

<div class="section">
    <h2>🏆 Highlights</h2>
    <div id="highlightList"></div>
</div>

<div class="section">
    <h2>📰 Nieuws</h2>
    <div id="newsList"></div>
</div>

<div class="section">
    <h2>🤝 Sponsors</h2>
    <div id="sponsorList"></div>
</div>

<div class="section">
    <h2>📸 Ome Jan</h2>
    <div id="omejanList"></div>
</div>

<script type="module" src="cms.js"></script>

</body>
</html>
