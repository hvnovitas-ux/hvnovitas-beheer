<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HV Novitas CMS</title>

<link rel="stylesheet" href="cms.css">
</head>

<body>

<!-- 🔐 STATUS (komt uit dashboard/login flow later) -->
<div id="userStatus"></div>

<!-- 🚪 LOGOUT (werkt met cms.js) -->
<button onclick="logout()">Uitloggen</button>

<hr>

<!-- 🧱 CLUB100 -->
<h2>🧱 Club100</h2>
<input id="clubName">
<button id="saveClub100">Toevoegen</button>
<div id="clubList"></div>

<hr>

<!-- 🏆 HIGHLIGHTS -->
<h2>🏆 Highlights</h2>
<input id="hlDate" type="date">
<input id="hlTitle">
<input id="hlText">
<button id="saveHighlight">Toevoegen</button>
<div id="highlightList"></div>

<hr>

<!-- 📰 NEWS -->
<h2>📰 News</h2>
<input id="newsTitle">
<input id="newsText">
<input type="file" id="newsImage">
<button id="saveNews">Toevoegen</button>
<div id="newsList"></div>

<hr>

<!-- 🤝 SPONSORS -->
<h2>🤝 Sponsors</h2>
<input type="file" id="sponsorImage">
<button id="saveSponsor">Toevoegen</button>
<div id="sponsorList"></div>

<hr>

<!-- 📸 OME JAN -->
<h2>📸 Ome Jan</h2>
<input type="file" id="omejanImage">
<button id="saveOmejan">Toevoegen</button>
<div id="omejanList"></div>

<!-- 🔥 CMS SCRIPT -->
<script type="module" src="cms.js"></script>

</body>
</html>
