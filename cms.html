<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HV Novitas CMS</title>

<link rel="stylesheet" href="cms.css">

</head>

<body>

<!-- =====================================================
STATUS
===================================================== -->

<div id="userStatus"></div>

<button onclick="logout()">

    Uitloggen

</button>

<hr>

<!-- =====================================================
CLUB100
===================================================== -->

<h2>🧱 Club100</h2>

<input
    id="clubName">

<button
    id="saveClub100">

    Toevoegen

</button>

<div id="clubList"></div>

<hr>

<!-- =====================================================
HIGHLIGHTS
===================================================== -->

<h2>🏆 Highlights</h2>

<input
    id="hlDate"
    type="date">

<input
    id="hlTitle"
    placeholder="Titel">

<input
    id="hlText"
    placeholder="Tekst">

<button
    id="saveHighlight">

    Toevoegen

</button>

<div id="highlightList"></div>

<hr>

<!-- =====================================================
NEWS
===================================================== -->

<h2>📰 Nieuws</h2>

<input
    id="newsTitle"
    placeholder="Titel">

<input
    id="newsText"
    placeholder="Tekst">

<input
    type="file"
    id="newsImage">

<button
    id="saveNews">

    Toevoegen

</button>

<div id="newsList"></div>

<hr>

<!-- =====================================================
SPONSORS
===================================================== -->

<h2>🤝 Sponsors</h2>

<input
    id="sponsorNaam"
    type="text"
    placeholder="Bedrijfsnaam">

<br>

<input
    id="sponsorWebsite"
    type="url"
    placeholder="https://www.bedrijf.nl">

<br>

<input
    type="file"
    id="sponsorImage">

<br>

<button
    id="saveSponsor">

    Sponsor toevoegen

</button>

<div id="sponsorList"></div>

<hr>

<!-- =====================================================
OME JAN
===================================================== -->

<h2>📸 Ome Jan</h2>

<input
    type="file"
    id="omejanImage">

<button
    id="saveOmejan">

    Toevoegen

</button>

<div id="omejanList"></div>

<!-- =====================================================
SCRIPT
===================================================== -->

<script
    type="module"
    src="cms.js">

</script>

</body>
</html>
