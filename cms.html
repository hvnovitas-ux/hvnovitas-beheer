<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nieuws beheren - HV Novitas</title>
  <link rel="stylesheet" href="cms.css">
</head>
<body>
  <div class="topbar">
    <div class="title">HV NOVITAS CMS — NIEUWS</div>
    <div class="userbox">
      <span id="userInfo">Laden...</span>
      <button type="button" class="logout" id="logoutButton">Uitloggen</button>
    </div>
  </div>

  <main class="page">
    <section class="section">
      <a class="back" href="dashboard.html">Terug naar dashboard</a>
      <h1>Nieuws beheren</h1>
      <p>Voeg een nieuwsbericht toe. Highlights, Sponsors, Club100 en Ome Jan beheer je via hun eigen knoppen op het dashboard.</p>

      <div class="fields">
        <input id="newsTitle" type="text" maxlength="180" placeholder="Titel van het nieuwsbericht" required>
        <input id="newsImage" type="file" accept="image/*">
        <textarea id="newsText" class="full" rows="6" maxlength="6000" placeholder="Tekst van het nieuwsbericht" required></textarea>
      </div>

      <label class="highlight-option" for="newsAsHighlight">
        <input id="newsAsHighlight" type="checkbox">
        <span>
          <strong>Ook bewaren als highlight</strong>
          <small>De titel, tekst, foto en plaatsingsdatum worden automatisch gekopieerd naar Highlights. Deze kopie blijft staan als je het nieuwsbericht later verwijdert.</small>
        </span>
      </label>

      <div class="actions">
        <button type="button" id="saveNews">Nieuws opslaan</button>
      </div>
      <div id="newsList" class="list" aria-live="polite"></div>
    </section>
  </main>

  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    const userInfo = document.getElementById("userInfo");
    const logoutButton = document.getElementById("logoutButton");

    onAuthStateChanged(auth, user => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      userInfo.textContent = user.displayName || user.email || "Beheerder";
    });

    logoutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (error) {
        console.error("Uitloggen mislukt:", error);
        alert("Uitloggen is niet gelukt.");
      }
    });
  </script>
  <script type="module" src="cms.js?v=20261015-existing-news-highlight"></script>
</body>
</html>
