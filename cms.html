<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HV Novitas CMS</title>

    <link rel="stylesheet" href="cms.css">
</head>

<body>

<div class="topbar">
    <div class="title">🧡 HV NOVITAS CMS</div>

    <div class="userbox">
        <span id="userInfo">Laden...</span>
        <button
            type="button"
            class="logout"
            id="logoutButton">
            Uitloggen
        </button>
    </div>
</div>

<main class="page">

    <!-- NIEUWS -->
    <section class="section">
        <h1>📰 Nieuws</h1>

        <div class="fields">
            <input
                id="newsTitle"
                type="text"
                placeholder="Titel">

            <input
                id="newsImage"
                type="file"
                accept="image/*">

            <textarea
                id="newsText"
                class="full"
                rows="5"
                placeholder="Tekst"></textarea>
        </div>

        <div class="actions">
            <button
                type="button"
                id="saveNews">
                Toevoegen
            </button>
        </div>

        <div
            id="newsList"
            class="list">
        </div>
    </section>

    <!-- HIGHLIGHTS -->
    <section class="section">
        <h2>🏆 Highlights</h2>

        <div class="fields">
            <input
                id="hlDate"
                type="date">

            <input
                id="hlTitle"
                type="text"
                placeholder="Titel">

            <input
                id="hlText"
                type="text"
                class="full"
                placeholder="Tekst">
        </div>

        <div class="actions">
            <button
                type="button"
                id="saveHighlight">
                Toevoegen
            </button>
        </div>

        <div
            id="highlightList"
            class="list">
        </div>
    </section>

    <!-- CLUB100 -->
    <section class="section">
        <h2>🧱 Club100</h2>

        <div class="fields">
            <input
                id="clubName"
                type="text"
                placeholder="Naam">

            <div>
                <button
                    type="button"
                    id="saveClub100">
                    Toevoegen
                </button>
            </div>
        </div>

        <div
            id="clubList"
            class="list">
        </div>
    </section>

    <!-- SPONSORS -->
    <section class="section">
        <h2>🤝 Sponsors</h2>

        <div class="fields">
            <input
                id="sponsorName"
                type="text"
                placeholder="Sponsor naam">

            <input
                id="sponsorWebsite"
                type="url"
                placeholder="Website">

            <input
                id="sponsorImage"
                type="file"
                accept="image/*">

            <div>
                <button
                    type="button"
                    id="saveSponsor">
                    Sponsor toevoegen
                </button>
            </div>
        </div>

        <div
            id="sponsorList"
            class="list">
        </div>
    </section>

    <!-- OME JAN -->
    <section class="section">
        <h2>📸 Ome Jan</h2>

        <div class="fields">
            <input
                id="omejanImage"
                type="file"
                accept="image/*">

            <div>
                <button
                    type="button"
                    id="saveOmejan">
                    Toevoegen
                </button>
            </div>
        </div>

        <div
            id="omejanList"
            class="list">
        </div>
    </section>

    <a
        class="back"
        href="dashboard.html">
        ← Terug naar dashboard
    </a>

</main>

<script type="module">
import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const userInfo =
    document.getElementById("userInfo");

const logoutButton =
    document.getElementById("logoutButton");

onAuthStateChanged(
    auth,
    (user) => {
        if (!user) {
            window.location.href =
                "login.html";
            return;
        }

        userInfo.innerText =
            "👋 " +
            (
                user.displayName ||
                user.email ||
                "Admin"
            );
    }
);

logoutButton.addEventListener(
    "click",
    async () => {
        try {
            await signOut(auth);

            window.location.href =
                "login.html";
        } catch (error) {
            console.error(
                "Uitloggen mislukt:",
                error
            );

            alert(
                "Uitloggen is niet gelukt."
            );
        }
    }
);
</script>

<script
    type="module"
    src="cms.js">
</script>

</body>
</html>
